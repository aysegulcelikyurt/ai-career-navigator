<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Navigator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="container">
      <div class="hero">
        <h1>Fill the form and get your personalized AI career roadmap 🚀</h1>
        <p>
          Understand how competitive you are and what to improve to land your dream internship.
        </p>
      </div>

      <form id="careerForm" class="career-form" enctype="multipart/form-data">
        <div class="form-group">
          <label for="department">Department</label>
          <input id="department" type="text" name="department" value="COMPUTER ENGINEERING" required />
        </div>

        <div class="form-group">
          <label for="target_role">Target Role</label>
          <input id="target_role" type="text" name="target_role" value="Software Engineering Intern" required />
        </div>

        <div class="form-group">
          <label for="company_name">Company Name</label>
          <input id="company_name" type="text" name="company_name" value="Trendyol" required />
        </div>

        <div class="form-group">
          <label for="application_stage">Application Stage</label>
          <select id="application_stage" name="application_stage" required>
            <option value="Before Application">Before Application</option>
            <option value="Before Interview">Before Interview</option>
            <option value="After Rejection">After Rejection</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cv_file">Upload CV (optional - AI will read it and use it)</label>
          <input id="cv_file" type="file" name="cv_file" accept=".pdf" />
        </div>

        <div class="form-group">
          <label for="cv_summary">CV Summary / Experience</label>
          <textarea
            id="cv_summary"
            name="cv_summary"
            rows="6"
            placeholder="Write your experience, projects, skills, leadership, internships..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="rejection_reason">If Rejected, What Happened?</label>
          <textarea
            id="rejection_reason"
            name="rejection_reason"
            rows="4"
            placeholder="Optional: write what happened in the process"
          ></textarea>
        </div>

        <button type="submit" class="submit-btn">Analyze My Career Path</button>
      </form>

      <section class="result-section">
        <h2>Your Career Analysis</h2>
        <div id="loadingBox" class="loading hidden">Analyzing your profile...</div>
        <div id="errorBox" class="error hidden"></div>
        <div id="resultBox"></div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
